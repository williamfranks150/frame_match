<title>Frame Match</title>
<style>
:root{
  --bg:#F0EEE8;
  --panel:#FBFAF7;
  --cell:#FFFFFF;
  --cell-2:#F5F3ED;
  --line:#D8D4C9;
  --line-soft:#E6E3DA;
  --ink:#191A1C;
  --ink-2:#6C6B64;
  --ink-3:#96948B;
  --accent:#8E6109;
  --accent-soft:rgba(142,97,9,.10);
  --index:#B3372C;
  --key:#FFFFFF;
  --key-2:#E8E5DC;
  --key-press:#DCD8CC;
  --shadow:0 1px 2px rgba(30,26,14,.10), 0 6px 18px rgba(30,26,14,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131417;
    --panel:#1A1C20;
    --cell:#212429;
    --cell-2:#1B1E22;
    --line:#33373E;
    --line-soft:#262A30;
    --ink:#EDE9E0;
    --ink-2:#8E9199;
    --ink-3:#6B6E76;
    --accent:#E9B44C;
    --accent-soft:rgba(233,180,76,.13);
    --index:#E0574A;
    --key:#262A30;
    --key-2:#1C1F24;
    --key-press:#333840;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#131417;
  --panel:#1A1C20;
  --cell:#212429;
  --cell-2:#1B1E22;
  --line:#33373E;
  --line-soft:#262A30;
  --ink:#EDE9E0;
  --ink-2:#8E9199;
  --ink-3:#6B6E76;
  --accent:#E9B44C;
  --accent-soft:rgba(233,180,76,.13);
  --index:#E0574A;
  --key:#262A30;
  --key-2:#1C1F24;
  --key-press:#333840;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.wrap{
  position:fixed;
  inset:0;
  margin:auto;
  width:100%;
  max-width:min(100%, 560px);
  height:100%;
  max-height:1000px;
  padding:14px 14px 16px;
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow:hidden;
}

h1{
  margin:0;
  flex:0 0 auto;
  padding-left:2px;
  font-family:"Barlow Condensed",Arial,sans-serif;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:14px;
  color:var(--ink-3);
}

/* ---- matrix ---- */
.matrix{
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:14px;
  padding:12px;
  box-shadow:var(--shadow);
  flex:1 1 38%;
  min-height:0;
  display:flex;
  flex-direction:column;
}
.heads{display:grid;grid-template-columns:1fr 1fr;column-gap:26px;margin-bottom:8px;}
.head{
  padding-left:3px;
  font-family:"Barlow Condensed",Arial,sans-serif;
  font-weight:600;
  font-size:17px;
  line-height:1;
  letter-spacing:.06em;
  color:var(--ink-2);
}

.body{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  column-gap:26px;
  row-gap:10px;
}
.body::before{
  content:"";
  position:absolute;
  left:50%;top:4px;bottom:4px;
  width:1px;
  transform:translateX(-.5px);
  background:var(--index);
  opacity:.5;
}

.cell{
  appearance:none;
  -webkit-appearance:none;
  text-align:left;
  font:inherit;
  color:inherit;
  background:var(--cell);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 11px 11px;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:4px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:border-color .12s ease, background .12s ease;
}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.cell .lab{
  font-family:"Barlow Condensed",Arial,sans-serif;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:11px;
  color:var(--ink-3);
}
.cell .val{
  font-size:clamp(26px, 7.4vw, 34px);
  font-weight:600;
  letter-spacing:-.02em;
  line-height:1.05;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  overflow:hidden;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
}
.cell .val .u{font-size:16px;font-weight:500;color:var(--ink-2);margin-left:1px;}
.cell .val.empty{color:var(--ink-3);font-weight:500;}
.cell.solved{background:var(--accent-soft);border-color:var(--accent);}
.cell.solved .val{color:var(--accent);}
.cell.active{border-color:var(--ink);}
.cell.active::after{
  content:"";
  position:absolute;left:-1px;top:-1px;bottom:-1px;
  width:3px;
  background:var(--index);
  border-radius:10px 0 0 10px;
}
.cell.active .val::after{
  content:"";
  display:inline-block;
  width:2px;height:.86em;
  background:var(--index);
  margin-left:3px;
  vertical-align:-.06em;
  animation:blink 1.06s steps(1,end) infinite;
}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* ---- keypad ---- */
.pad{
  flex:1 1 62%;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(4,1fr);
  gap:8px;
}
.pad button{
  font-family:"Archivo",Arial,sans-serif;
  font-size:clamp(21px, 5.8vw, 26px);
  font-weight:500;
  color:var(--ink);
  background:var(--key);
  border:1px solid var(--line);
  border-radius:10px;
  min-height:0;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
  font-variant-numeric:tabular-nums;
  transition:background .07s ease;
}
.pad button:active{background:var(--key-press);}
.pad button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.pad button.alt{background:var(--key-2);color:var(--accent);}
.pad button.util{background:var(--key-2);color:var(--ink-2);}
.pad button.dual{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  line-height:1;
}
.pad button.dual .g{font-size:24px;font-weight:600;line-height:.8;}
.pad button.dual .c{
  font-family:"Barlow Condensed",Arial,sans-serif;
  font-size:11px;
  font-weight:500;
  letter-spacing:.14em;
  text-transform:uppercase;
  opacity:.72;
}
.pad button.word{
  font-family:"Barlow Condensed",Arial,sans-serif;
  font-size:15px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.pad button svg{display:block;margin:0 auto;}
.pad button[disabled]{opacity:.3;cursor:default;}
.pad button[disabled]:active{background:var(--key-2);}

/* ---- tablet portrait: more width, bigger type ---- */
@media (min-width:700px) and (max-aspect-ratio:1/1){
  .wrap{max-width:min(92vw, 700px);max-height:none;padding:18px 18px 20px;gap:16px;}
  .cell .val{font-size:clamp(34px, 5.4vw, 48px);}
  .cell .lab{font-size:13px;}
  .head{font-size:20px;}
  .pad{gap:12px;}
  .pad button{font-size:clamp(26px, 4vw, 34px);}
  .pad button.dual .g{font-size:32px;}
  .pad button.dual .c{font-size:13px;}
  .pad button.word{font-size:19px;}
  h1{font-size:16px;}
}

/* ---- landscape / wide: matrix and keypad side by side ---- */
@media (min-width:680px) and (min-aspect-ratio:1/1){
  .wrap{
    max-width:1240px;
    max-height:880px;
    display:grid;
    grid-template-columns:1.15fr 1fr;
    grid-template-rows:auto minmax(0,1fr);
    column-gap:18px;
    row-gap:10px;
    padding:16px 18px 18px;
  }
  h1{grid-column:1 / -1;}
  .matrix{flex:none;height:100%;}
  .pad{flex:none;height:100%;gap:10px;}
  .cell .val{font-size:clamp(30px, 4.4vw, 46px);}
  .pad button{font-size:clamp(24px, 3.2vw, 32px);}
  .pad button.dual .g{font-size:clamp(26px, 3.4vw, 34px);}
  .pad button.dual .c{font-size:13px;}
  .pad button.word{font-size:clamp(16px, 1.9vw, 20px);}
  .cell .lab{font-size:12.5px;}
  .head{font-size:19px;}
}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>
<div class="wrap">

  <h1>Frame Match</h1>

  <div class="matrix">
    <div class="heads">
      <div class="head">A</div>
      <div class="head">B</div>
    </div>

    <div class="body">
      <button class="cell" id="c-aLens" type="button">
        <span class="lab">Lens (mm)</span>
        <span class="val" id="v-aLens"></span>
      </button>
      <button class="cell" id="c-bLens" type="button">
        <span class="lab">Lens (mm)</span>
        <span class="val" id="v-bLens"></span>
      </button>
      <button class="cell" id="c-aDist" type="button">
        <span class="lab">Distance</span>
        <span class="val" id="v-aDist"></span>
      </button>
      <button class="cell" id="c-bDist" type="button">
        <span class="lab">Distance</span>
        <span class="val" id="v-bDist"></span>
      </button>
    </div>
  </div>

  <div class="pad" id="pad">
    <button type="button" data-k="7">7</button>
    <button type="button" data-k="8">8</button>
    <button type="button" data-k="9">9</button>
    <button type="button" class="util" data-k="del" aria-label="Delete">
      <svg width="24" height="17" viewBox="0 0 24 17" fill="none" aria-hidden="true">
        <path d="M8.2 1.2h13a1.6 1.6 0 0 1 1.6 1.6v11.4a1.6 1.6 0 0 1-1.6 1.6h-13L1.4 8.5z"
              stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M12.4 5.9l5.2 5.2M17.6 5.9l-5.2 5.2"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>

    <button type="button" data-k="4">4</button>
    <button type="button" data-k="5">5</button>
    <button type="button" data-k="6">6</button>
    <button type="button" class="alt dual" data-k="ft" id="k-ft" aria-label="Feet">
      <span class="g">&#8242;</span><span class="c">ft</span>
    </button>

    <button type="button" data-k="1">1</button>
    <button type="button" data-k="2">2</button>
    <button type="button" data-k="3">3</button>
    <button type="button" class="alt dual" data-k="in" id="k-in" aria-label="Inches">
      <span class="g">&#8243;</span><span class="c">in</span>
    </button>

    <button type="button" data-k="0">0</button>
    <button type="button" data-k=".">.</button>
    <button type="button" class="alt word" data-k="sp" id="k-sp">Space</button>
    <button type="button" class="util word" data-k="clr">Clear</button>
  </div>

</div>

<script>
(function(){
  var KEYS = ["aLens","bLens","aDist","bDist"];
  var isLens = function(k){ return k.indexOf("Lens") > -1; };

  var raw = { aLens:"", bLens:"", aDist:"", bDist:"" };
  var recency = ["bLens","aDist","aLens","bDist"];
  var active = null;
  var typing = false;

  var SPACE_GLYPH = "·";

  function parseDist(s){
    if(s == null) return null;
    s = String(s).trim()
      .replace(/[’‘ʼ]/g,"'")
      .replace(/[“”ʺ]/g,'"')
      .replace(new RegExp(SPACE_GLYPH,"g")," ");
    if(!s) return null;
    var fm = s.match(/(\d*\.?\d+)\s*'/);
    var im = s.match(/(\d*\.?\d+)\s*"/);
    if(fm || im){
      var ft = fm ? parseFloat(fm[1]) : 0;
      var inch = im ? parseFloat(im[1]) : 0;
      if(fm && !im){
        var tail = s.slice(s.indexOf(fm[0]) + fm[0].length).trim();
        var t = parseFloat(tail);
        if(!isNaN(t)) inch = t;
      }
      if(isNaN(ft) || isNaN(inch)) return null;
      return ft * 12 + inch;
    }
    var parts = s.split(/\s+/).map(parseFloat).filter(function(n){ return !isNaN(n); });
    if(!parts.length) return null;
    if(parts.length === 1) return parts[0] * 12;
    return parts[0] * 12 + parts[1];
  }

  function parseLens(s){
    if(s == null) return null;
    var n = parseFloat(String(s).replace(/[^\d.]/g,""));
    return isNaN(n) ? null : n;
  }

  var FRAC = { 0:"", 0.25:"¼", 0.5:"½", 0.75:"¾" };
  var PF = "′", PI = "″"; // prime, double prime

  function fmtDist(inches){
    if(inches == null || !isFinite(inches) || inches < 0) return null;
    if(inches < 24){
      var q = Math.round(inches * 4) / 4;
      if(q >= 24) return "2" + PF + "0" + PI;
      var whole = Math.floor(q);
      var f = FRAC[+(q - whole).toFixed(2)] || "";
      if(whole === 0 && f) return f + PI;
      return whole + f + PI;
    }
    var total = Math.round(inches);
    return Math.floor(total / 12) + PF + (total % 12) + PI;
  }

  // what a half-typed entry looks like while the keys are being pressed
  function displayRaw(s, lens){
    if(!s) return "";
    if(lens) return s;
    var out = s
      .replace(new RegExp(SPACE_GLYPH, "g"), PF)
      .replace(/'/g, PF)
      .replace(/"/g, PI);
    if(new RegExp(PF + "[\\d.]*\\d$").test(out)) return out + PI;
    if(/^[\d.]*\d$/.test(out)) return out + PF;
    return out;
  }

  function fmtLens(mm){
    if(mm == null || !isFinite(mm) || mm <= 0) return null;
    var r = Math.round(mm * 10) / 10;
    return Math.abs(r - Math.round(r)) < 0.05 ? String(Math.round(r)) : r.toFixed(1);
  }

  function solvedKey(){ return recency[3]; }

  function values(){
    var v = {};
    KEYS.forEach(function(k){
      v[k] = isLens(k) ? parseLens(raw[k]) : parseDist(raw[k]);
    });
    var s = solvedKey();
    v[s] = null;
    var fA = v.aLens, fB = v.bLens, dA = v.aDist, dB = v.bDist;
    var ok = function(n){ return n != null && isFinite(n) && n > 0; };
    if(s === "bDist" && ok(fA) && ok(fB) && ok(dA)) v.bDist = dA * fB / fA;
    if(s === "aDist" && ok(fA) && ok(fB) && ok(dB)) v.aDist = dB * fA / fB;
    if(s === "bLens" && ok(fA) && ok(dA) && ok(dB)) v.bLens = fA * dB / dA;
    if(s === "aLens" && ok(fB) && ok(dA) && ok(dB)) v.aLens = fB * dA / dB;
    return v;
  }

  function render(){
    var v = values();
    var s = solvedKey();

    KEYS.forEach(function(k){
      var cell = document.getElementById("c-" + k);
      var el = document.getElementById("v-" + k);
      var isSolved = (k === s) && v[k] != null && isFinite(v[k]) && v[k] > 0;
      cell.classList.toggle("solved", isSolved);
      cell.classList.toggle("active", k === active);

      var text;
      if(k === active && typing){
        text = displayRaw(raw[k], isLens(k));
      } else if(k === s){
        text = isLens(k) ? fmtLens(v[k]) : fmtDist(v[k]);
      } else {
        text = isLens(k) ? fmtLens(parseLens(raw[k])) : fmtDist(parseDist(raw[k]));
      }

      el.textContent = "";
      if(text === null || text === undefined || text === ""){
        el.className = "val empty";
        el.textContent = (k === active) ? "" : "–";
      } else {
        el.className = "val";
        el.textContent = text;
      }
    });

    var distMode = !!(active && !isLens(active));
    ["k-ft","k-in","k-sp"].forEach(function(id){
      document.getElementById(id).disabled = !distMode;
    });
  }

  function activate(k){
    if(active === k) return;
    active = k;
    typing = false;
    recency = [k].concat(recency.filter(function(x){ return x !== k; }));
    render();
  }

  function clearAll(){
    raw = { aLens:"", bLens:"", aDist:"", bDist:"" };
    active = null;
    typing = false;
    render();
  }

  function press(key){
    if(key === "clr"){ clearAll(); return; }
    if(!active) return;
    if(!typing){
      if(key !== "del") raw[active] = "";
      typing = true;
    }
    var cur = raw[active];
    if(key === "del"){
      raw[active] = cur.slice(0, -1);
    } else if(key === "ft"){
      if(cur && !/['"]$/.test(cur)) raw[active] = cur + "'";
    } else if(key === "in"){
      if(cur && !/['"]$/.test(cur)) raw[active] = cur + '"';
    } else if(key === "sp"){
      if(cur && !/[\s"]$/.test(cur) && cur.indexOf(SPACE_GLYPH) === -1) raw[active] = cur + SPACE_GLYPH;
    } else if(key === "."){
      var last = cur.split(new RegExp("[" + SPACE_GLYPH + "'\"]")).pop();
      if(last.indexOf(".") === -1) raw[active] = cur + ".";
    } else {
      if(cur.replace(/\D/g,"").length < 7) raw[active] = cur + key;
    }
    render();
  }

  KEYS.forEach(function(k){
    document.getElementById("c-" + k).addEventListener("click", function(){
      if(active === k){ raw[k] = ""; typing = true; render(); return; }
      activate(k);
    });
  });

  document.getElementById("pad").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b || b.disabled) return;
    press(b.getAttribute("data-k"));
  });

  document.addEventListener("keydown", function(e){
    if(!active) return;
    var k = e.key;
    if(/^[0-9]$/.test(k)) { press(k); e.preventDefault(); }
    else if(k === ".") { press("."); e.preventDefault(); }
    else if(k === "Backspace") { press("del"); e.preventDefault(); }
    else if(k === "'") { press("ft"); e.preventDefault(); }
    else if(k === '"') { press("in"); e.preventDefault(); }
    else if(k === " ") { press("sp"); e.preventDefault(); }
    else if(k === "Escape") { press("clr"); e.preventDefault(); }
  });

  activate("aLens");
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', function(){ navigator.serviceWorker.register('sw.js'); });
}
</script>
</body>
</html>
